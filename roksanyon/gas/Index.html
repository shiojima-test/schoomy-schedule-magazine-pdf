<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--ink:#1a1a1a;--sub:#5b5b5b;--line:#e3e3e3;--bg:#f6f6f4;--card:#fff;--yellow:#ffbe00;--ok:#1f7a4a;--ng:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Meiryo,"メイリオ","Hiragino Sans",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px 48px;display:flex;flex-direction:column;gap:24px}
h1{font-size:24px;font-weight:900;margin:0}
.sub{margin:4px 0 0;color:var(--sub);font-size:14px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.row{display:flex;gap:10px}
select,input{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:999px;padding:15px;background:var(--ink);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.msg{border-left:4px solid var(--ok);padding:12px 14px;background:var(--card);border-radius:8px;line-height:1.7}
.msg.ng{border-color:var(--ng);color:var(--ng)}
h2{font-size:16px;margin:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.item small{color:var(--sub);display:block;font-size:12px}
.ghost{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.ghost.warn{border-color:var(--ng);color:var(--ng)}
.empty{color:var(--sub);font-size:14px;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>ロクサンヨンをアップする</h1>
    <p class="sub">PDFを選んで「アップして公開」を押すと、すぐにホームページに載ります。</p>
  </header>

  <div id="main">
    <section class="card" style="margin-bottom:24px">
      <div>
        <label for="y">何月号ですか</label>
        <div class="row">
          <select id="y"></select>
          <select id="m"></select>
        </div>
        <p class="hint">同じ月号がすでにあるときは、新しいPDFに差し替わります。</p>
      </div>
      <div>
        <label for="pdf">PDFファイル</label>
        <input id="pdf" type="file" accept="application/pdf">
      </div>
      <button class="btn" id="upBtn" type="button">アップして公開</button>
    </section>

    <section class="card">
      <h2>公開中の号</h2>
      <div id="list"><p class="empty">読み込み中です</p></div>
    </section>
  </div>

  <div class="msg" id="msg" role="status" hidden></div>
</main>

<script>
function $(id) { return document.getElementById(id); }
function say(text, ng) { var m = $('msg'); m.textContent = text; m.className = ng ? 'msg ng' : 'msg'; m.hidden = false; }
function hideMsg() { $('msg').hidden = true; }

// 月号の初期値は来月（月末に翌月号をアップする想定）
(function () {
  var now = new Date(), next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    var o = document.createElement('option'); o.value = y; o.textContent = y + '年'; if (y === next.getFullYear()) o.selected = true; $('y').appendChild(o);
  }
  for (var m = 1; m <= 12; m++) {
    var p = document.createElement('option'); p.value = m; p.textContent = m + '月号'; if (m === next.getMonth() + 1) p.selected = true; $('m').appendChild(p);
  }
})();

function renderList(items) {
  var box = $('list'); box.innerHTML = '';
  if (!items.length) { box.innerHTML = '<p class="empty">まだありません。</p>'; return; }
  items.forEach(function (it) {
    var row = document.createElement('div'); row.className = 'item';
    var t = document.createElement('div'); t.textContent = it.label;
    var s = document.createElement('small'); s.textContent = it.uploaded + ' アップ'; t.appendChild(s);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'ghost'; b.textContent = '取り下げる';
    b.onclick = function () {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.className = 'ghost warn'; b.textContent = 'もう一度押すと取り下げ'; return; }
      b.disabled = true; b.textContent = '取り下げ中';
      google.script.run.withSuccessHandler(function (list) { renderList(list); say(it.label + 'を取り下げました。ホームページからも消えています。'); })
        .withFailureHandler(function (e) { b.disabled = false; say(e.message, true); }).withdrawIssue(it.id);
    };
    row.appendChild(t); row.appendChild(b); box.appendChild(row);
  });
}

google.script.run.withSuccessHandler(renderList).withFailureHandler(function (e) { say(e.message, true); }).listIssues();

$('upBtn').onclick = function () {
  var file = $('pdf').files[0];
  if (!file) { say('PDFファイルを選んでください。', true); return; }
  var label = $('y').value + '年' + $('m').value + '月号';
  var btn = $('upBtn'); btn.disabled = true; btn.textContent = 'アップ中です（そのままお待ちください）'; hideMsg();
  var reader = new FileReader();
  reader.onload = function () {
    var b64 = String(reader.result).split(',')[1];
    google.script.run.withSuccessHandler(function (res) {
      btn.disabled = false; btn.textContent = 'アップして公開'; $('pdf').value = '';
      renderList(res.list); say(res.label + 'を公開しました。ホームページに載っています。');
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'アップして公開'; say(e.message, true);
    }).uploadIssue($('y').value, $('m').value, b64);
  };
  reader.onerror = function () { btn.disabled = false; btn.textContent = 'アップして公開'; say('PDFを読み込めませんでした。', true); };
  reader.readAsDataURL(file);
};
</script>
</body>
</html>
