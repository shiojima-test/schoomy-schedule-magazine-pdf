<style>

#schoomy-634-v1 [hidden]{display:none}
#schoomy-634-v1 .schoomy-634-heading{display:flex;align-items:center;gap:18px;margin-bottom:36px}
#schoomy-634-v1 .schoomy-634-heading__icon{width:64px;height:64px;flex-shrink:0}

<script>
(function () {
  var LIST_URL = 'https://docs.google.com/spreadsheets/d/1v5_TuOy0FcOQoDqXcYIV6YqHJTPburmvtccXyNBwsUc/gviz/tq?tqx=out:csv';
  var LEAD = 'スクーミーの月刊社外報です。毎月のフェスタや学校の取り組み、フェスタの年間スケジュールを掲載しています。';
  var ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';

  var latestEl = document.getElementById('schoomy-634-latest');
  var backWrap = document.getElementById('schoomy-634-backwrap');
  var shelfEl = document.getElementById('schoomy-634-shelf');

  function parseCsv(text) {
    var rows = [], row = [], cell = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text.charAt(i);
      if (q) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { cell += '"'; i++; } else { q = false; }
        } else { cell += c; }
      } else if (c === '"') { q = true; }
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') { cell += c; }
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text) { e.textContent = text; }
    return e;
  }

  // 表紙の画像。横長（見開き）なら右半分の表紙だけを見せる
  function cover(url, alt, cls) {
    var frame = el('div', 'schoomy-634-frame' + (cls ? ' ' + cls : ''));
    var img = el('img');
    img.alt = alt; img.loading = 'lazy';
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      if (w > h) {
        frame.className += ' is-spread';
        frame.style.aspectRatio = (w / 2) + ' / ' + h;
      }
    };
    img.src = String(url).replace('sz=w1200', 'sz=w2400');
    frame.appendChild(img);
    return frame;
  }

  function showStatus(msg) {
    latestEl.innerHTML = '';
    latestEl.appendChild(el('p', 'schoomy-634-status', msg));
  }

  function render(issues) {
    if (!issues.length) { showStatus('準備中です。'); return; }
    var top = issues[0];
    latestEl.innerHTML = '';

    latestEl.appendChild(cover(top.cover, top.label + 'の表紙', 'schoomy-634-cover'));

    var info = el('div', 'schoomy-634-info');
    info.appendChild(el('span', 'schoomy-634-badge', '最新号'));
    info.appendChild(el('p', 'schoomy-634-issue', top.label));
    info.appendChild(el('p', 'schoomy-634-lead', LEAD));
    var a = el('a', 'schoomy-634-dl');
    a.href = top.download; a.rel = 'noopener';
    a.innerHTML = ICON_DL + 'PDFをダウンロード';
    info.appendChild(a);
    if (top.size) { info.appendChild(el('span', 'schoomy-634-size', 'PDF ' + top.size + 'MB')); }
    latestEl.appendChild(info);

    if (issues.length > 1) {
      for (var i = 1; i < issues.length; i++) {
        var it = issues[i];
        var b = el('a', 'schoomy-634-back');
        b.href = it.download; b.rel = 'noopener';
        b.appendChild(cover(it.cover, it.label + 'の表紙', ''));
        b.appendChild(el('b', '', it.label));
        b.appendChild(el('span', '', 'ダウンロード'));
        shelfEl.appendChild(b);
      }
      backWrap.hidden = false;
    }
  }

  fetch(LIST_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.text(); })
    .then(function (text) {
      var rows = parseCsv(text);
      if (!rows.length) { render([]); return; }
      var h = rows[0], idx = {};
      for (var k = 0; k < h.length; k++) { idx[h[k]] = k; }
      var issues = [];
      for (var r = 1; r < rows.length; r++) {
        var row = rows[r];
        var url = row[idx.download_url];
        if (url) {
          issues.push({ label: row[idx.label], cover: row[idx.cover_url], download: url, size: row[idx.size_mb] });
        }
      }
      render(issues);
    })
    .catch(function () { showStatus('読み込めませんでした。時間をおいてもう一度開いてください。'); });
})();
</script>
