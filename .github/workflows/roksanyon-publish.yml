name: ロクサンヨン公開（ドライブ → 掲載一覧）

permissions:
  contents: read

on:
  schedule:
    - cron: '17 * * * *'   # 毎時17分（UTC）。ドライブに置いて1時間以内にホームページへ載る
  workflow_dispatch:

concurrency:
  group: roksanyon-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: 掲載一覧を作り直す
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python roksanyon/sync.py
