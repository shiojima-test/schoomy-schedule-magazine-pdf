name: Generate Schedule PDF (Magazine)

permissions:
  contents: write

on:
  repository_dispatch:
    types: [generate-pdf]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install M PLUS 2 font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-mplus
          fc-cache -fv
          fc-list | grep -i "m plus 2" | head -5

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Generate PDF
        run: python src/generate_pdf.py --output schedule.pdf

      # 1ページでなければ Drive を上書きせずに失敗させる（公開中PDFを壊さない）
      - name: Verify single page
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          n = len(PdfReader('schedule.pdf').pages)
          print(f'PDF pages: {n}')
          assert n == 1, f'expected 1 page, got {n}'
          PY

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-pdf
          path: schedule.pdf

      # レイアウト確認用のプレビュー画像をリポジトリに残す
      - name: Render preview PNG
        run: |
          sudo apt-get install -y poppler-utils
          mkdir -p debug
          pdftoppm -png -r 110 -f 1 -l 1 schedule.pdf debug/preview
          mv debug/preview-1.png debug/preview.png

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/preview.png
          git commit -m "chore: プレビュー画像を更新" || exit 0
          git pull --rebase
          git push

      - name: Upload to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python upload_to_drive.py schedule.pdf
